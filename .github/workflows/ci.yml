name: CI

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sizes:
    strategy:
      fail-fast: true

    name: Contract sizes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.5

      - name: Contract sizes
        run: |
          forge --version
          forge build --sizes --skip CryticTester --skip CryticVaultsTester --skip CryticNonTransferrableScaledTokenDifferentialCryticTester
        id: build

  fmt:
    strategy:
      fail-fast: true

    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.5

      - name: Format
        run: |
          forge fmt --check
        id: fmt

  test:
    strategy:
      fail-fast: true

    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.5

      - name: Test
        run: |
          forge test -vvv
        id: test

  testFork:
    strategy:
      fail-fast: true

    name: Fork Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.5

      - name: Fork Test
        run: |
          forge test -vvv --fail-fast --threads 1
        id: test
        env:
          API_KEY_ALCHEMY: ${{ secrets.API_KEY_ALCHEMY }}
          FOUNDRY_INVARIANT_RUNS: 0
          FOUNDRY_INVARIANT_DEPTH: 0
          FOUNDRY_PROFILE: fork

  slither:
    strategy:
      fail-fast: true

    name: Slither
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.5

      - name: Remove rheo-fm for Slither
        run: rm -rf lib/rheo-fm

      - name: Stub rheo-fm for Slither
        shell: bash
        run: |
          mkdir -p .slither-stubs/rheo-fm/src/collections/interfaces
          mkdir -p .slither-stubs/rheo-fm/src/market/interfaces
          mkdir -p .slither-stubs/rheo-fm/src/market/libraries
          mkdir -p .slither-stubs/rheo-fm/src/market/libraries/actions

          cat <<'EOF' > .slither-stubs/rheo-fm/src/market/interfaces/IRheo.sol
          // SPDX-License-Identifier: MIT
          pragma solidity 0.8.23;

          string constant VERSION = "slither-stub";

          interface IRheo {}
          EOF

          cat <<'EOF' > .slither-stubs/rheo-fm/src/market/libraries/OfferLibrary.sol
          // SPDX-License-Identifier: MIT
          pragma solidity 0.8.23;

          struct CopyLimitOrderConfig {
              bool placeholder;
          }
          EOF

          cat <<'EOF' > .slither-stubs/rheo-fm/src/market/libraries/actions/Initialize.sol
          // SPDX-License-Identifier: MIT
          pragma solidity 0.8.23;

          struct InitializeFeeConfigParams {
              bool placeholder;
          }
          struct InitializeRiskConfigParams {
              bool placeholder;
          }
          struct InitializeOracleParams {
              bool placeholder;
          }
          struct InitializeDataParams {
              bool placeholder;
          }
          EOF

          cat <<'EOF' > .slither-stubs/rheo-fm/src/collections/interfaces/ICollectionsManager.sol
          // SPDX-License-Identifier: MIT
          pragma solidity 0.8.23;

          import {IRheo} from "../../market/interfaces/IRheo.sol";
          import {CopyLimitOrderConfig} from "../../market/libraries/OfferLibrary.sol";

          interface ICollectionsManager {
              function subscribeUserToCollections(address user, uint256[] memory collectionIds) external;
              function unsubscribeUserFromCollections(address user, uint256[] memory collectionIds) external;
              function setUserCollectionCopyLimitOrderConfigs(
                  address user,
                  uint256 collectionId,
                  CopyLimitOrderConfig memory copyLoanOfferConfig,
                  CopyLimitOrderConfig memory copyBorrowOfferConfig
              ) external;
              function getLoanOfferAPR(
                  address user,
                  uint256 collectionId,
                  IRheo market,
                  address rateProvider,
                  uint256 tenor
              ) external view returns (uint256);
              function getBorrowOfferAPR(
                  address user,
                  uint256 collectionId,
                  IRheo market,
                  address rateProvider,
                  uint256 tenor
              ) external view returns (uint256);
              function isBorrowAPRLowerThanLoanOfferAPRs(
                  address user,
                  uint256 borrowAPR,
                  IRheo market,
                  uint256 tenor
              ) external view returns (bool);
              function isLoanAPRGreaterThanBorrowOfferAPRs(
                  address user,
                  uint256 loanAPR,
                  IRheo market,
                  uint256 tenor
              ) external view returns (bool);
          }
          EOF

          cp remappings.txt remappings.txt.bak
          python3 - <<'PY'
          from pathlib import Path
          remappings = Path("remappings.txt")
          lines = remappings.read_text().splitlines()
          replaced = []
          for line in lines:
              if line.startswith("@rheo-fm="):
                  replaced.append("@rheo-fm=.slither-stubs/rheo-fm")
              else:
                  replaced.append(line)
          remappings.write_text("\n".join(replaced) + "\n")
          PY

      - name: Install Slither
        run: |
          python3 -m pip install --user slither-analyzer
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run Slither
        run: |
          slither src --exclude-dependencies --fail-low


  solhint:
    strategy:
      fail-fast: true

    name: Solhint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install dependencies
        run: npm install

      - name: Run solhint
        run: npm run solhint

  invariants:
    if: github.event_name != 'pull_request'
    needs: [sizes, fmt, test, testFork, slither, solhint]
    strategy:
      fail-fast: true
      matrix:
        mode: [assertion, property, medusa]

    name: Invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.5

      - name: Install Crytic-compile
        run: |
          pip install crytic-compile

      - name: Install Slither
        run: |
          pip install slither-analyzer

      - name: Prepare Crytic
        run: |
          ./script/prepare_crytic.sh

      - name: Install Fuzzer (${{ matrix.mode }})
        run: |
          if [[ "${{ matrix.mode }}" == "assertion" || "${{ matrix.mode }}" == "property" ]]; then
            TOOL="echidna"
            URL="https://github.com/crytic/echidna/releases/download/v2.2.6/echidna-2.2.6-x86_64-linux.tar.gz"
          elif [[ "${{ matrix.mode }}" == "medusa" ]]; then
            TOOL="medusa"
            URL="https://github.com/crytic/medusa/releases/download/v1.1.1/medusa-linux-x64.tar.gz"
          else
            echo "Unsupported mode: ${{ matrix.mode }}"
            exit 1
          fi

          wget "$URL" -O "$TOOL.tar.gz"
          tar -xvkf "$TOOL.tar.gz"
          rm "$TOOL.tar.gz"
          ./$TOOL --version

      - name: Run Fuzzer (${{ matrix.mode }})
        run: |
          if [[ "${{ matrix.mode }}" == "assertion" || "${{ matrix.mode }}" == "property" ]]; then
            ./echidna test/invariants/crytic/CryticTester.sol --contract CryticTester --config echidna.yaml --test-mode ${{ matrix.mode }} --corpus-dir corpus --test-limit 10000
          elif [[ "${{ matrix.mode }}" == "medusa" ]]; then
            sed -i 's/\"testLimit\":.*/\"testLimit\": 50000,/g' medusa.json
            sed -i 's/\"corpusDirectory\":.*/\"corpusDirectory\": \"medusa-corpus\",/g' medusa.json
            ./medusa fuzz
          else
            echo "Unsupported mode: ${{ matrix.mode }}"
            exit 1
          fi


  halmos:
    needs: [sizes, fmt, test, testFork, slither, solhint]
    strategy:
      fail-fast: true

    name: Halmos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.5

      - name: Install Halmos
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv tool install --python 3.12 halmos

      - name: Halmos
        run: |
          halmos --match-contract Math

  abi:
    strategy:
      fail-fast: true

    name: ABI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.5

      - name: Install dependencies
        run: npm install

      - name: ABI
        run: |
          forge build --build-info

      - name: Archive ABI
        uses: actions/upload-artifact@v4
        with:
          name: abi
          path: |
            out/Size.sol/Size.json
            out/SizeFactory.sol/SizeFactory.json
            out/CollectionsManager.sol/CollectionsManager.json
            out/IPriceFeed.sol/IPriceFeed.json
            out/IERC20Metadata.sol/IERC20Metadata.json
            out/Errors.sol/Errors.json
            out/Events.sol/Events.json

  coverage:
    strategy:
      fail-fast: true

    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.5

      - name: Install dependencies
        run: npm install

      - name: Coverage
        run: |
          forge coverage --no-match-coverage "(script|test|deprecated)" --report lcov

      - name: Coveralls
        uses: coverallsapp/github-action@v2
        if: ${{ !github.event.repository.private }}
        with:
          coverage-reporter-version: v0.6.15
          fail-on-error: false

  upload-selectors:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: true

    name: Upload Selectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.5

      - name: Upload Selectors
        run: |
          forge selectors upload --all
